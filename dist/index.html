<!doctypehtml><html lang=en><head><meta charset=utf-8><meta content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"name=viewport><title>fill a canvas with a 1px brush</title><style>body,html{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font-family:sans-serif}#canvas{display:block;outline:0;touch-action:none}#status{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}</style></head><body><div id=status>loading…</div><div><canvas id=canvas oncontextmenu=event.preventDefault() tabindex=-1></canvas></div><script>var statusEl=document.getElementById("status"),Module={canvas:document.getElementById("canvas"),setStatus:function(t){statusEl.textContent=t,statusEl.style.display=t?"flex":"none"},onAbort:function(){Module.setStatus("something went wrong, check the console")}}</script><script async src=index.js></script></body></html>
