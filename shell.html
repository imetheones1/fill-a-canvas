<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>fill a canvas with a 1px brush</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: sans-serif;
        }
        /* No CSS width/height on the canvas: SDL sizes it to fill the tab itself */
        #canvas {
            display: block;
            outline: none;
        }
        #status {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div id="status">loading…</div>
    <!-- Wrapped so the canvas has no next sibling; SDL's fill-document cleanup
         breaks when it tries to re-insert the canvas before one -->
    <div><canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas></div>
    <script>
        var statusEl = document.getElementById('status');
        var Module = {
            canvas: document.getElementById('canvas'),
            setStatus: function (text) {
                statusEl.textContent = text;
                statusEl.style.display = text ? 'flex' : 'none';
            },
            onAbort: function () {
                Module.setStatus('something went wrong, check the console');
            },
        };
    </script>
    {{{ SCRIPT }}}
</body>
</html>
